<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Kaio Dantas — sistema inicializando">
<title>Kaio Dantas — Android nativo, Java e Web</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03060c"/><stop offset=".6" stop-color="#061020"/><stop offset="1" stop-color="#03060c"/>
  </linearGradient>
  <linearGradient id="tit" x1="0" x2="1">
    <stop offset="0" stop-color="#e9f8ff"/><stop offset=".55" stop-color="#00e5ff"/><stop offset="1" stop-color="#19d3a2"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#19d3a2"/></linearGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#e9fdff"/><stop offset=".35" stop-color="#00e5ff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#0f2a44" stroke-width=".6"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00e5ff" opacity=".04"/></pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="c1"><rect x="48" y="44" width="0" height="20"><animate attributeName="width" from="0" to="520" dur=".9s" begin=".2s" fill="freeze"/></rect></clipPath>
  <clipPath id="c2"><rect x="48" y="66" width="0" height="20"><animate attributeName="width" from="0" to="520" dur=".9s" begin="1.1s" fill="freeze"/></rect></clipPath>
  <clipPath id="c3"><rect x="48" y="88" width="0" height="20"><animate attributeName="width" from="0" to="520" dur=".9s" begin="2s" fill="freeze"/></rect></clipPath>
  <clipPath id="c4"><rect x="48" y="110" width="0" height="20"><animate attributeName="width" from="0" to="520" dur=".6s" begin="2.9s" fill="freeze"/></rect></clipPath>
</defs>
<style>
  .log{font:400 13px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:#6f93b5}
  .ok{fill:#19d3a2;font-weight:700}
  .on{fill:#00e5ff;font-weight:700}
  .name{font:800 64px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;letter-spacing:6px}
  .sub{font:500 16px 'JetBrains Mono','Fira Code',Consolas,monospace;fill:#9fc3e0;letter-spacing:1px}
  .hud{font:600 10px 'JetBrains Mono',Consolas,monospace;fill:#00e5ff;letter-spacing:2px}
  .appear{opacity:0;animation:ap .7s ease forwards}
  @keyframes ap{to{opacity:1}}
  .glitch{opacity:0;animation:ap .1s 3.6s forwards,gl 5s 4.2s infinite}
  @keyframes gl{0%,93%,100%{transform:translate(0,0)}94%{transform:translate(-3px,1px)}96%{transform:translate(3px,-1px)}98%{transform:translate(-1px,0)}}
  .ghost{opacity:0;animation:gh 5s 4.2s infinite}
  @keyframes gh{0%,93%,100%{opacity:0}94%,97%{opacity:.55}}
  .spin{transform-origin:830px 160px;animation:sp 22s linear infinite}
  .spinr{transform-origin:830px 160px;animation:sp 14s linear infinite reverse}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pulse{transform-origin:830px 160px;animation:pu 2.4s ease-in-out infinite}
  @keyframes pu{50%{transform:scale(.82);opacity:.7}}
  .caret{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
  .sweep{animation:sw 6s linear infinite}@keyframes sw{from{transform:translateX(-200px)}to{transform:translateX(1100px)}}
  @media (prefers-reduced-motion: reduce){
    .appear,.glitch{animation:none;opacity:1}.ghost,.spin,.spinr,.pulse,.caret,.sweep{animation:none}
  }
</style>

<rect width="1000" height="320" rx="14" fill="url(#bg)"/>
<rect width="1000" height="320" rx="14" fill="url(#grid)" opacity=".7"/>
<rect width="1000" height="320" rx="14" fill="url(#scan)"/>
<rect x=".5" y=".5" width="999" height="319" rx="14" fill="none" stroke="#12304a"/>
<rect class="sweep" x="0" y="0" width="120" height="320" fill="#00e5ff" opacity=".035"/>

<!-- cantos HUD -->
<g stroke="#00e5ff" stroke-width="2" fill="none">
  <path d="M16 40V16H40"/><path d="M960 16H984V40"/><path d="M16 280V304H40"/><path d="M960 304H984V280"/>
</g>
<text x="48" y="30" class="hud" opacity=".7">K.A.I.O // CORE v2.6 · PB-BR</text>

<!-- log de boot: cada linha "digita" via clipPath -->
<g clip-path="url(#c1)"><text x="48" y="58" class="log">&gt; inicializando núcleo .................. <tspan class="ok">[ OK ]</tspan></text></g>
<g clip-path="url(#c2)"><text x="48" y="80" class="log">&gt; carregando módulos: java · android · web <tspan class="ok">[ OK ]</tspan></text></g>
<g clip-path="url(#c3)"><text x="48" y="102" class="log">&gt; sincronizando projetos ................ <tspan class="ok">[ OK ]</tspan></text></g>
<g clip-path="url(#c4)"><text x="48" y="124" class="log">&gt; <tspan class="on">SYSTEM ONLINE</tspan><tspan class="caret" fill="#19d3a2"> █</tspan></text></g>

<!-- barra de progresso -->
<rect x="48" y="140" width="460" height="4" rx="2" fill="#0f2a44"/>
<rect x="48" y="140" width="0" height="4" rx="2" fill="url(#bar)" filter="url(#glow)">
  <animate attributeName="width" values="0;180;300;460" keyTimes="0;.35;.7;1" dur="3.2s" begin=".2s" fill="freeze"/>
</rect>

<!-- nome com glitch -->
<g class="ghost"><text x="45" y="222" class="name" fill="#ff2e88" opacity=".8">KAIO DANTAS</text></g>
<g class="ghost" style="animation-delay:4.25s"><text x="51" y="222" class="name" fill="#00e5ff" opacity=".8">KAIO DANTAS</text></g>
<g class="glitch"><text x="48" y="222" class="name" fill="url(#tit)" filter="url(#glow)">KAIO DANTAS</text></g>
<text x="50" y="258" class="sub appear" style="animation-delay:3.9s">Android nativo · Java · Web  <tspan fill="#19d3a2">//</tspan>  Técnico em Informática · IFPB</text>
<text x="50" y="284" class="log appear" style="animation-delay:4.3s">status: <tspan class="ok">construindo o Serpenteando</tspan>  ·  local: Paraíba, Brasil</text>

<!-- reator HUD -->
<g class="appear" style="animation-delay:.4s">
  <circle cx="830" cy="160" r="118" fill="none" stroke="#0f2a44" stroke-width="1"/>
  <g class="spin">
    <circle cx="830" cy="160" r="108" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="60 18 8 18" opacity=".8"/>
    <path d="M830 42 v12 M830 266 v12 M712 160 h12 M936 160 h12" stroke="#00e5ff" stroke-width="2"/>
  </g>
  <g class="spinr">
    <circle cx="830" cy="160" r="86" fill="none" stroke="#19d3a2" stroke-width="5" stroke-dasharray="4 10" opacity=".9"/>
  </g>
  <g class="spin" style="animation-duration:9s">
    <circle cx="830" cy="160" r="66" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="110 40" opacity=".9"/>
  </g>
  <circle cx="830" cy="160" r="48" fill="#061528" stroke="#12304a"/>
  <g class="pulse"><circle cx="830" cy="160" r="40" fill="url(#core)"/></g>
  <text x="830" y="164" text-anchor="middle" style="font:800 15px 'JetBrains Mono',Consolas,monospace;fill:#03060c;letter-spacing:2px">KD</text>
  <text x="830" y="300" text-anchor="middle" class="hud" opacity=".7">REACTOR · 100%</text>
</g>
</svg>
