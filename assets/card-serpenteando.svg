<svg xmlns="http://www.w3.org/2000/svg" width="980" height="230" viewBox="0 0 980 230" role="img" aria-label="Serpenteando">
<title>Serpenteando — App Android nativo para aprender sobre serpentes brasileiras: modelo 3D da cascavel, quiz com 3 níveis, missões gamificadas, mitos e verdades e enciclopédia de espécies.</title>
<defs>
<linearGradient id="bd" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#19d3a2"/><stop offset=".5" stop-color="#12304a"/><stop offset="1" stop-color="#C4A84D"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#19d3a2" stop-opacity=".22"/><stop offset="1" stop-color="#19d3a2" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#0f2a44" stroke-width=".5"/></pattern>
</defs>
<style>
.tag{font:600 11px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;letter-spacing:2px}
.t{font:800 26px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#eaf6ff;letter-spacing:.5px}
.d{font:400 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#8fb0cc}
.chip{font:600 11px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.st{font:600 11px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.in{opacity:0;animation:in .8s ease forwards}@keyframes in{to{opacity:1}}
.dot{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
.shine{animation:sh 5s ease-in-out infinite}@keyframes sh{0%,60%{transform:translateX(-980px)}100%{transform:translateX(980px)}}
@media (prefers-reduced-motion: reduce){.in{animation:none;opacity:1}.dot,.shine{animation:none}}
</style>
<rect x="1" y="1" width="978" height="228" rx="14" fill="#05080f" stroke="url(#bd)" stroke-width="1.5"/>
<rect x="1" y="1" width="978" height="228" rx="14" fill="url(#grid)" opacity=".6"/>
<rect x="1" y="1" width="978" height="228" rx="14" fill="url(#glow)"/>
<path class="shine" d="M0 230 L60 0 H100 L40 230Z" fill="#ffffff" opacity=".025"/>
<g class="in">
<text x="28" y="40" class="tag" fill="#19d3a2">// PROJETO EM DESTAQUE · TCC</text>
<circle class="dot" cx="860" cy="36" r="4" fill="#C4A84D"/><text x="952" y="40" text-anchor="end" class="st" fill="#C4A84D">EM DESENVOLVIMENTO</text>
<text x="28" y="80" class="t">Serpenteando</text>
<g transform="translate(830 60)" opacity=".85"><path d="M0 60 c0-22 36-22 36 0 s36 22 36 0 s-36-22 -36-44" fill="none" stroke="#19d3a2" stroke-width="6" stroke-linecap="round"/><circle cx="36" cy="16" r="7" fill="#C4A84D"/><circle cx="38" cy="14" r="1.6" fill="#05080f"/></g>
<text x="28" y="118" class="d">App Android nativo para aprender sobre serpentes brasileiras: modelo 3D da cascavel,</text><text x="28" y="139" class="d">quiz com 3 níveis, missões gamificadas, mitos e verdades e enciclopédia de espécies.</text>
<rect x="28" y="184" width="50" height="22" rx="11" fill="#19d3a2" fill-opacity=".1" stroke="#19d3a2" stroke-opacity=".5"/><text x="53" y="199" text-anchor="middle" class="chip" fill="#19d3a2">Java</text><rect x="86" y="184" width="72" height="22" rx="11" fill="#19d3a2" fill-opacity=".1" stroke="#19d3a2" stroke-opacity=".5"/><text x="122" y="199" text-anchor="middle" class="chip" fill="#19d3a2">Android</text><rect x="165" y="184" width="101" height="22" rx="11" fill="#19d3a2" fill-opacity=".1" stroke="#19d3a2" stroke-opacity=".5"/><text x="216" y="199" text-anchor="middle" class="chip" fill="#19d3a2">Filament 3D</text><rect x="275" y="184" width="64" height="22" rx="11" fill="#19d3a2" fill-opacity=".1" stroke="#19d3a2" stroke-opacity=".5"/><text x="307" y="199" text-anchor="middle" class="chip" fill="#19d3a2">SQLite</text><rect x="347" y="184" width="109" height="22" rx="11" fill="#19d3a2" fill-opacity=".1" stroke="#19d3a2" stroke-opacity=".5"/><text x="402" y="199" text-anchor="middle" class="chip" fill="#19d3a2">PT · EN · ES</text>
</g>
</svg>