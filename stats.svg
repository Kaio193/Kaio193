<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" role="img" aria-label="SYS.DIAGNOSTICS">
<title>SYS.DIAGNOSTICS</title>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#19d3a2"/></linearGradient>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".07"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#12304a" stroke-width=".5" opacity=".55"/></pattern>
</defs>
<style>
  .t{font:600 13px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:#00e5ff;letter-spacing:2px}
  .s{font:400 11px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:#5f7f9e}
  .l{font:400 12px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#5f7f9e}
  .v{font:700 20px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:#d6ecff}
  .big{font:700 34px 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;fill:url(#g)}
  .in{opacity:0;animation:in .6s ease forwards}
  @keyframes in{to{opacity:1}}
  .blink{animation:b 1s steps(1) infinite} @keyframes b{50%{opacity:0}}
  .sweep{animation:sw 4s linear infinite} @keyframes sw{from{transform:translateY(-210px)}to{transform:translateY(210px)}}
  @media (prefers-reduced-motion: reduce){.in{animation:none;opacity:1}.blink,.sweep{animation:none}}
</style>
<rect x=".5" y=".5" width="479" height="209" rx="10" fill="#05080f" stroke="#12304a"/>
<rect x="1" y="1" width="478" height="208" rx="10" fill="url(#grid)"/>
<path d="M8 22 V8 H22" stroke="#00e5ff" stroke-width="2" fill="none"/><path d="M458 8 H472 V22" stroke="#00e5ff" stroke-width="2" fill="none"/><path d="M8 188 V202 H22" stroke="#00e5ff" stroke-width="2" fill="none"/><path d="M458 202 H472 V188" stroke="#00e5ff" stroke-width="2" fill="none"/>
<text x="26" y="34" class="t">SYS.DIAGNOSTICS<tspan class="blink" fill="#19d3a2"> _</tspan></text>
<text x="454" y="34" class="s" text-anchor="end">últimos 365 dias</text>
<line x1="26" y1="46" x2="454" y2="46" stroke="#12304a"/>
<g class="in" style="animation-delay:0.00s"><rect x="26" y="67" width="4" height="4" fill="#19d3a2"/><text x="40" y="76" class="l">Contribuições (12 meses)</text><text x="300" y="76" class="v" text-anchor="end" style="font-size:15px">128</text></g><g class="in" style="animation-delay:0.15s"><rect x="26" y="93" width="4" height="4" fill="#19d3a2"/><text x="40" y="102" class="l">Commits</text><text x="300" y="102" class="v" text-anchor="end" style="font-size:15px">124</text></g><g class="in" style="animation-delay:0.30s"><rect x="26" y="119" width="4" height="4" fill="#19d3a2"/><text x="40" y="128" class="l">Pull requests</text><text x="300" y="128" class="v" text-anchor="end" style="font-size:15px">0</text></g><g class="in" style="animation-delay:0.45s"><rect x="26" y="145" width="4" height="4" fill="#19d3a2"/><text x="40" y="154" class="l">Repositórios públicos</text><text x="300" y="154" class="v" text-anchor="end" style="font-size:15px">4</text></g><g class="in" style="animation-delay:0.60s"><rect x="26" y="171" width="4" height="4" fill="#19d3a2"/><text x="40" y="180" class="l">Estrelas recebidas</text><text x="300" y="180" class="v" text-anchor="end" style="font-size:15px">0</text></g><g transform="rotate(-90 392 126)">
  <circle cx="392" cy="126" r="52" stroke="#12304a" stroke-width="8" fill="none"/>
  <circle cx="392" cy="126" r="52" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round"
    stroke-dasharray="326.7" stroke-dashoffset="326.7">
    <animate attributeName="stroke-dashoffset" from="326.7" to="300.8" dur="1.6s" begin=".3s" fill="freeze"/>
  </circle>
  <circle cx="392" cy="126" r="64" stroke="#00e5ff" stroke-width="1" fill="none" stroke-dasharray="2 8" opacity=".6">
    <animateTransform attributeName="transform" type="rotate" from="0 392 126" to="360 392 126" dur="24s" repeatCount="indefinite"/>
  </circle>
</g>
<text x="392" y="130" class="v" text-anchor="middle">29</text>
<text x="392" y="148" class="s" text-anchor="middle">dias ativos</text>
<rect class="sweep" x="0" y="0" width="480" height="105" fill="url(#scan)" pointer-events="none"/>
</svg>